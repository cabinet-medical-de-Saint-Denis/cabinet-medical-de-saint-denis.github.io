name: Fix deleted recipes in movements

on:
  push:
    paths:
      - ".github/workflows/fix-deleted-recipes-movements.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch movement resource list
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = "function fillMovementResources()"
          if marker not in text:
              raise SystemExit("fillMovementResources not found")

          old = 'const resources=activeResources().filter(r=>!withdrawal||state.recipes.some(rc=>rc.productId===r.id));'
          new = 'const resources=activeResources().filter(r=>r.kind==="ingredient" || state.recipes.some(rc=>rc.productId===r.id)).filter(r=>!withdrawal||state.recipes.some(rc=>rc.productId===r.id));'

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one target line, found {count}")

          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix: retirer les recettes supprimées des entrées/sorties"
          git push
