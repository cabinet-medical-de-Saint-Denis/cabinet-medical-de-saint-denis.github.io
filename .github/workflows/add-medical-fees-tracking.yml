name: Add Saint-Denis medical fees tracking

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-medical-fees-tracking.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_medical_fees.py
      - name: Validate patch
        run: |
          grep -q 'value="FRAIS_MEDICAUX"' index.html
          grep -q 'id="medicalFeesBody"' index.html
          grep -q 'FRAIS_MEDICAUX_RESET' index.html
      - name: Commit changes
        run: |
          rm -f .github/workflows/add-medical-fees-tracking.yml
          rm -f .github/scripts/patch_medical_fees.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-medical-fees-tracking.yml .github/scripts/patch_medical_fees.py
          git commit -m "Ajouter le suivi des frais médicaux par docteur"
          git push
