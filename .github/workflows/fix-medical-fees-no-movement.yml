name: Fix Saint-Denis medical fees no movement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-medical-fees-no-movement.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python .github/scripts/fix_medical_fees_no_movement.py
          grep -q 'type==="FRAIS_MEDICAUX"?0' index.html
      - name: Commit
        run: |
          rm -f .github/workflows/fix-medical-fees-no-movement.yml
          rm -f .github/scripts/fix_medical_fees_no_movement.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-medical-fees-no-movement.yml .github/scripts/fix_medical_fees_no_movement.py
          git commit -m "Ne pas modifier stock ni caisse pour les frais médicaux"
          git push
