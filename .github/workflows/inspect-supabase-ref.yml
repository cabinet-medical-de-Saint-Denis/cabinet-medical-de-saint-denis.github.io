name: Inspect Supabase ref

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-supabase-ref.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print Supabase config
        run: |
          grep -n "SUPABASE_URL\|supabase.co" index.html | head -20
      - name: Remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/inspect-supabase-ref.yml
          git add .github/workflows/inspect-supabase-ref.yml
          git commit -m "Retirer inspection Supabase temporaire"
          git push
