name: Inspect Saint-Denis profile access

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-profile-access.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print profile and state contexts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          keys=['from("profiles")',"admin_list_profiles","currentProfile","display_name","const state=","function typeLabel","function renderAll","renderHistory();","loadRemoteState"]
          for key in keys:
              print("\n===== KEY:",key,"=====")
              start=0
              for n in range(6):
                  i=s.find(key,start)
                  if i<0: break
                  print(f"\n--- {n+1} at {i} ---\n")
                  print(s[max(0,i-1400):min(len(s),i+3200)])
                  start=i+len(key)
          PY
      - name: Remove inspection workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/inspect-profile-access.yml
          git add .github/workflows/inspect-profile-access.yml
          git commit -m "Retirer l'inspection temporaire des profils"
          git push
