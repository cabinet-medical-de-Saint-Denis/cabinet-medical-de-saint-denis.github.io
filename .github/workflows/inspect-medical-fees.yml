name: Inspect Saint-Denis medical fees integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-medical-fees.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print relevant source contexts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          keys=[
            'id="mvType"',
            'function fillMovementResources',
            'function renderHistory',
            'history',
            'profiles',
            'state.users',
            'isAdmin',
            'KIT DE SOIN',
            'SERINGUE VIVIFIANTE',
            'typeLabel(',
            'movement_type'
          ]
          for key in keys:
              print("\n\n===== KEY:",key,"=====")
              start=0
              found=0
              while True:
                  i=s.find(key,start)
                  if i<0: break
                  found+=1
                  print(f"\n--- occurrence {found} at {i} ---\n")
                  print(s[max(0,i-1800):min(len(s),i+4200)])
                  start=i+len(key)
                  if found>=8: break
              if found==0:
                  print("NOT FOUND")
          PY
      - name: Remove inspection workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/inspect-medical-fees.yml
          git add .github/workflows/inspect-medical-fees.yml
          git commit -m "Retirer le workflow temporaire d'inspection"
          git push
